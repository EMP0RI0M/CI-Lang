name: FluxOS Bare-Metal CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust Nightly
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2024-04-18
        components: rust-src, llvm-tools-preview
        
    - name: Install bootimage
      run: rustup toolchain install stable && cargo +stable install bootimage --locked
      
    - name: Build FluxOS (x86_64-os.json target)
      working-directory: ./rust_vm
      run: cargo build -Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem --target x86_64-os.json
      
    - name: Run Tests
      working-directory: ./rust_vm
      run: cargo build --tests -Zbuild-std=core,compiler_builtins,alloc -Zbuild-std-features=compiler-builtins-mem --target x86_64-os.json
