name: FluxOS Bare-Metal CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust Nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src, llvm-tools-preview
        
    - name: Install bootimage
      run: cargo install bootimage
      
    - name: Build FluxOS (x86_64-os.json target)
      working-directory: ./rust_vm
      run: cargo build --target x86_64-os.json
      
    - name: Run Tests
      working-directory: ./rust_vm
      run: cargo test
