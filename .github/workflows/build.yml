name: FluxOS Bare-Metal CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust Nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src, llvm-tools-preview
        
    - name: Install bootimage
      run: rustup toolchain install stable && cargo +stable install bootimage --locked
      
    - name: Build FluxOS (x86_64-os.json target)
      working-directory: ./rust_vm
      run: cargo build -Zjson-target-spec -Zbuild-std=core,compiler_builtins,alloc,panic_abort -Zbuild-std-features=compiler-builtins-mem
      
    - name: Run Tests
      working-directory: ./rust_vm
      run: cargo test -Zjson-target-spec -Zbuild-std=core,compiler_builtins,alloc,panic_abort -Zbuild-std-features=compiler-builtins-mem
